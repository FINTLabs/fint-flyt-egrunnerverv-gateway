fint:
  application-id: fint-flyt-egrunnerverv-gateway

novari:
  flyt:
    egrunnerverv:
      checkSaksansvarligEpost: true
      checkSaksbehandler: true
      checkEmailDomain: true
      dispatch:
        base-url: https://vigoikstest.service-now.com/api/now/table
        token-uri: https://vigoikstest.service-now.com/oauth_token.do
        tablenameSak: x_nvas_grunnerverv_grunnerverv
        tablenameJournalpost: x_nvas_grunnerverv_dokumenter
        instance-initial-delay: 120000
        instance-fixed-delay: 300000
        registration-id: egrunnerverv
      # The other FLYT services run under /<org> (api) or /beta/<org> (beta), unlike this gateway, so the
      # internal URLs cannot be derived from server.servlet.context-path. Set per overlay.
      service-context-path: ""
    intgr-conf-service-url: http://fint-flyt-intgr-conf-service:8080${novari.flyt.egrunnerverv.service-context-path}
    history-service-url: http://fint-flyt-history-service:8080${novari.flyt.egrunnerverv.service-context-path}
    archive-gateway-url: http://fint-flyt-archive-gateway:8080${novari.flyt.egrunnerverv.service-context-path}
    web-resource-server:
      security:
        authorization:
          base-url: http://fint-flyt-authorization-service:8080${novari.flyt.egrunnerverv.service-context-path}

logging:
  level:
    no.novari.cache.ehcache.FintEhCacheEventLogger: WARN

server:
  max-http-request-header-size: 40KB
  tomcat:
    max-http-form-post-size: 100MB
    max-swallow-size: 100MB

spring:
  profiles:
    include:
      - flyt-kafka
      - flyt-logging
      - flyt-postgres
      - flyt-web-resource-server
      - flyt-file-web-client
      - flyt-authorization-client
      - flyt-service-now-web-client
  output:
    ansi:
      enabled: always

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
